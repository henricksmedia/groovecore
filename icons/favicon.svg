<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- GrooveCore favicon: orange-on-black step-pad motif -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- 4x4 step-pad grid; lit pads trace a G-for-Groove pattern -->
  <g>
    <!-- row 1 -->
    <rect x="56"  y="56"  width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="160" y="56"  width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="264" y="56"  width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="368" y="56"  width="88" height="88" rx="18" fill="#1e1e1e" stroke="#333333" stroke-width="6"/>
    <!-- row 2 -->
    <rect x="56"  y="160" width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="160" y="160" width="88" height="88" rx="18" fill="#1e1e1e" stroke="#333333" stroke-width="6"/>
    <rect x="264" y="160" width="88" height="88" rx="18" fill="#1e1e1e" stroke="#333333" stroke-width="6"/>
    <rect x="368" y="160" width="88" height="88" rx="18" fill="#1e1e1e" stroke="#333333" stroke-width="6"/>
    <!-- row 3 -->
    <rect x="56"  y="264" width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="160" y="264" width="88" height="88" rx="18" fill="#1e1e1e" stroke="#333333" stroke-width="6"/>
    <rect x="264" y="264" width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="368" y="264" width="88" height="88" rx="18" fill="#ff6b1a"/>
    <!-- row 4 -->
    <rect x="56"  y="368" width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="160" y="368" width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="264" y="368" width="88" height="88" rx="18" fill="#ff6b1a"/>
    <rect x="368" y="368" width="88" height="88" rx="18" fill="#ff6b1a"/>
  </g>
</svg>
